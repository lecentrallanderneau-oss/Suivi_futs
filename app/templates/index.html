{% extends "base.html" %}
{% block title %}Accueil{% endblock %}
{% block content %}
<div class="row g-3">
    <div class="col-md-4">
        <div class="card p-3">
            <div class="text-secondary">Nombre de clients</div>
            <div class="fs-2 fw-bold">{{ total_clients }}</div>
        </div>
    </div>
</div>
<div class="mt-4">
    <h5>Clients</h5>
    <ul class="list-group">
        {% for c in clients %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ c.name }}{% if c.city %} — <small class="text-muted">{{ c.city }}</small>{% endif %}</span>
            <form method="post" action="{{ url_for('main.client_delete', client_id=c.id) }}">
                <button class="btn btn-sm btn-outline-danger" type="submit">Supprimer</button>
            </form>
        </li>
        {% else %}
        <li class="list-group-item">Aucun client pour le moment.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
