{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4">Clients</h1>
  <form class="d-flex gap-2" method="post" action="{{ url_for('client_new_post') }}">
    <input class="form-control" name="name" placeholder="Nom du client" required>
    <input class="form-control" name="city" placeholder="Ville (optionnel)">
    <button class="btn btn-success">Ajouter</button>
  </form>
</div>

<div class="list-group">
  {% for c in clients %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <a href="{{ url_for('client_detail', client_id=c.id) }}"><strong>{{ c.name }}</strong></a>
        {% if c.city %}<span class="text-muted"> – {{ c.city }}</span>{% endif %}
      </div>
      <form method="post" action="{{ url_for('client_delete', client_id=c.id) }}" onsubmit="return confirm('Supprimer ce client ?')">
        <button class="btn btn-sm btn-outline-danger">Supprimer</button>
      </form>
    </div>
  {% else %}
    <div class="text-muted">Aucun client pour l'instant.</div>
  {% endfor %}
</div>
{% endblock %}
