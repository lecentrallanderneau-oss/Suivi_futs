{% extends "base.html" %}
{% block content %}
  <h1 class="h4 mb-3">Clients</h1>

  {% if clients and clients|length %}
    <div class="list-group">
      {% for c in clients %}
        <a href="{{ url_for('client_detail', client_id=c.id) }}" class="list-group-item list-group-item-action">
          {{ c.name }}
        </a>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-info">Aucun client pour le moment.</div>
  {% endif %}
{% endblock %}
