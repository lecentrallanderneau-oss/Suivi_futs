<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livraison & Suivi Fûts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">Suivi Fûts</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
            aria-controls="nav" aria-expanded="false" aria-label="Basculer la navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- On pointe désormais vers 'index' au lieu de 'clients' -->
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['index','client_detail'] %}active{% endif %}"
             href="{{ url_for('index') }}">Clients</a>
        </li>

        <!-- Si tu as un catalogue plus tard, adapte l’endpoint ici -->
        {# <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ['catalog'] %}active{% endif %}"
             href="{{ url_for('catalog') }}">Catalogue</a>
        </li> #}
      </ul>
      <div class="d-flex">
        <!-- Zone d’actions globales si besoin -->
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
