{% extends "base.html" %}
{% block content %}
  <h1 class="h4 mb-3">Fiche client</h1>

  <div class="card mb-3">
    <div class="card-body">
      <h2 class="h5">{{ client.name }}</h2>
      <p class="text-muted m-0">Ici on ajoutera livraisons & reprises.</p>
    </div>
  </div>

  <!-- Formulaire "stub" vers add_movement : ne crée rien pour l’instant -->
  <form method="post" action="{{ url_for('add_movement', client_id=client.id) }}" class="row g-2">
    <div class="col-auto">
      <select name="movement_type" class="form-select" required>
        <option value="delivery">Livraison</option>
        <option value="return">Reprise</option>
      </select>
    </div>
    <div class="col-auto">
      <input type="text" name="note" class="form-control" placeholder="Note (optionnel)">
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" type="submit">Enregistrer (bientôt)</button>
    </div>
  </form>
{% endblock %}
