{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h3 mb-0">Accueil</h1>
  <small class="text-muted">{{ now.strftime('%d/%m/%Y %H:%M') }}</small>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div class="text-muted small">Consignes théoriques : {{ totals.deposit_cents|eur }}</div>
  </div>
</div>

<div class="card">
  <div class="card-header">Clients (aperçu)</div>
  <div class="card-body p-0">
    <ul class="list-group list-group-flush">
      {% for c in clients %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>{{ c.name }}</span>
          <a class="btn btn-sm btn-outline-primary" href="{{ url_for('client_detail', client_id=c.id) }}">Ouvrir</a>
        </li>
      {% else %}
        <li class="list-group-item text-muted">Aucun client.</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
