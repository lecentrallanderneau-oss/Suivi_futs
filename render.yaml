services:
  - type: web
    name: suivi-futs
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: suivi-futs-db
          property: connectionString
databases:
  - name: suivi-futs-db
    plan: free
